# Netlify config per Filo (Next.js 14 App Router)

[build]
  command = "npm run build"   # esegue `prisma generate` + `next build`
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Le variabili d'ambiente (DATABASE_URL, DIRECT_URL, NEXTAUTH_SECRET,
# NEXTAUTH_URL, ANTHROPIC_API_KEY, OPENAI_API_KEY/GROQ_API_KEY) vanno impostate
# in Site settings → Environment variables, non qui (non committare i secret).
