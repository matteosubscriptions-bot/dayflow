# Netlify config per Officina & Specchio (Next.js 14 App Router)

[build]
  # Applica le migration Prisma al DB di produzione, poi builda
  # (`npm run build` esegue anche `prisma generate`).
  command = "npx prisma migrate deploy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Le variabili d'ambiente vanno impostate in Site configuration →
# Environment variables (non qui: niente secret nel repo):
#   DATABASE_URL      → Postgres gestito (Supabase/Neon/Railway)
#   ANTHROPIC_API_KEY → opzionale: attiva gli agenti AI
#   ANTHROPIC_MODEL   → opzionale (default claude-sonnet-4-6)
